name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path 'NoTestModeWM.ps1', 'No Test Mode Watermark.cmd', 'ntmwm.dll' -DestinationPath "no-test-mode-wm-$env:GITHUB_REF_NAME.zip" -Force

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "no-test-mode-wm-$env:GITHUB_REF_NAME.zip" --draft --title $env:GITHUB_REF_NAME --notes ''
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed ($LASTEXITCODE)"
          }
